                <span class="dot dot-green"></span>
              </div>
              <span class="file-name">1. Navbar.jsx</span>
            </div>
            <button class="btn btn-copy" type="button" aria-label="Copy Navbar.jsx code">

                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <svg class="btn-icon check-icon" viewBox="0 0 24 24" style="display: none;">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span class="btn-text">Copy</span>
            </button>
          </div>
          <div class="code-body">
            <div class="line-numbers" aria-hidden="true"></div>
            <pre><code class="code-content"></code></pre>
